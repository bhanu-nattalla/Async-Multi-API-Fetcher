[project]
name = "async-multi-api-fetcher"
version = "0.1.0"
description = "Async multi-API fetcher CLI (Open-Meteo, REST Countries, openFDA)"
readme = "README.md"
authors = [
    { name = "bhanu-nattalla", email = "bhanunattala@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "asyncio>=4.0.0",
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "numpy>=2.5.4",
    "openmeteo-requests>=1.7.5",
    "pandas>=3.1.0",
    "pydantic>=2.14.2",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]

[project.scripts]
async-multi-api-fetcher = "async_multi_api_fetcher.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/async_multi_api_fetcher"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "mypy>=1.10",
    "ruff>=0.5",
]
 
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
 
[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
 
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]
 
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
 
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]